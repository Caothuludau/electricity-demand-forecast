services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy-backend
    ports:
      - "8000:8000"
    volumes:
      - ./document:/app/document:ro
      - ./notebooks/models:/app/models:ro
      - ./notebooks/output/model_evaluation.json:/app/data/model_evaluation.json:ro
      - imported-data:/app/data/imported
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  imported-data:
