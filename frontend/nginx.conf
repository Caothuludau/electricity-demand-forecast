server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: /data-drivers etc. resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # same-origin API proxy: the browser calls /api/* here, nginx forwards
    # to the backend service inside the compose network. The frontend bundle
    # needs no VITE_API_BASE_URL in this setup (defaults to same origin).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
